<!doctype html>
<html lang="pl" data-theme="dark" style="background:#081321">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#081321">
<meta name="color-scheme" content="dark light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Warsztat">
<meta name="description" content="Mechanik, który prowadzi Cię za rękę, śruba po śrubie. Instrukcje napraw, części, narzędzia.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192-v3.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-v3.png">
<title>Warsztat</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="bg"><i></i></div>
<div id="app"><div class="skeleton"></div></div>
<nav id="tabbar" aria-label="Nawigacja"><div class="bar" id="tabs"></div></nav>
<div id="sheet" aria-hidden="true"><div class="scrim"></div><div class="panel" role="dialog" aria-modal="true"><div class="grab"></div><div id="sheet-body"></div></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<noscript><p style="padding:24px;color:#fff">Warsztat wymaga włączonego JavaScriptu.</p></noscript>
<script>
// samoleczenie: jeśli aplikacja się nie uruchomi (np. niespójna pamięć podręczna), wyczyść cache i odśwież raz
setTimeout(function () {
  if (window.__warsztatOK) return;
  try { if (sessionStorage.getItem('healed')) return; sessionStorage.setItem('healed', '1'); } catch (e) {}
  var done = function () { location.reload(); };
  Promise.all([
    navigator.serviceWorker ? navigator.serviceWorker.getRegistrations().then(function (r) { return Promise.all(r.map(function (x) { return x.unregister(); })); }) : 0,
    window.caches ? caches.keys().then(function (k) { return Promise.all(k.map(function (x) { return caches.delete(x); })); }) : 0
  ]).then(done, done);
}, 4000);
</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
